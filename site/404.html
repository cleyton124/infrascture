<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Não Encontrada (404) - Infraestrutura S3</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-purple: #a855f7;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .error-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 3rem 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }

        .error-code {
    font-size: 5rem;
    font-weight: bold;
    background: linear-gradient(to right, var(--accent-red), var(--accent-purple));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    line-height: 1;
    margin-bottom: 1rem;
}

        .error-icon {
            width: 80px;
            height: 80px;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.8rem;
            color: var(--text-main);
        }

        p {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(to right, var(--accent-blue), var(--accent-purple));
            color: #ffffff;
            text-decoration: none;
            padding: 0.8rem 1.8rem;
            border-radius: 8px;
            font-weight: 600;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .btn-home:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        footer {
            margin-top: 2rem;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="error-card">
            <!-- Ícone SVG de erro/alerta -->
            <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>

            <div class="error-code">404</div>
            <h1>Página Não Encontrada</h1>
            <p>O recurso que você tentou acessar não existe no bucket S3 ou a rota digitada está incorreta.</p>

            <a href="index.html" class="btn-home">
                &larr; Voltar para a Página Principal
            </a>
        </div>

        <footer>
            <p>AWS S3 Static Website Host &bull; Custom Error Document</p>
        </footer>
    </div>

</body>
</html>
